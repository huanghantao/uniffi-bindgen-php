[package]
name = "uniffi-bindgen-php"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "uniffi_bindgen_php"
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen-php"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = { version = "0.14.0", default-features = false, features = ["config", "derive", "alloc"] }
camino = "1"
fs-err = "3"
heck = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "=0.8.23"
uniffi_bindgen = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.31.1", package = "uniffi_bindgen" }
